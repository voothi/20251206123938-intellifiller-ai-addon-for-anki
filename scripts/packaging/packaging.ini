[release]
default_output_dir = C:\Users\voothi\Documents\20251206191819-intellifilter-publication
python_version = 3.13
python_interpreter = C:\Python\Python313\python.exe

[vendor]
packages = 
    typing_extensions>=4.7.0
    pydantic
    pyzipper

# Format: platform_tag = dir_name
[platforms]
macosx_11_0_arm64 = darwin_arm64
macosx_10_15_x86_64 = darwin_x86_64
win_amd64 = win32
manylinux2014_x86_64 = linux

[exclusions]
root_files = 
    meta.json

dir_names = 
    user_files
    __pycache__
    .git
    .vscode
    .idea

[pipeline]
# The steps to run in sequence during release generation.
# 'pytest' is a special keyword to execute python -m pytest.
# Other items are assumed to be python scripts located in this folder.
steps =
    setup_local_vendor.py
    pytest
    create_addon_zip.py
